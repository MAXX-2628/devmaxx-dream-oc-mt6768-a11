name: Build Kernel with KernelSU

on:
  workflow_dispatch:
    inputs:
      device:
        description: Device to build
        type: choice
        options:
          - lancelot
          - merlin
        default: lancelot

jobs:
  build:
    name: Build kernel for ${{ github.event.inputs.device }}
    runs-on: ubuntu-22.04
    env:
      DEVICE: ${{ github.event.inputs.device || 'lancelot' }}

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: shas-noc

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison ca-certificates cpio curl file flex git make \
            libssl-dev libncurses-dev xz-utils zlib1g-dev \
            device-tree-compiler perl python3 zip unzip \
            libc6-dev-i386 lib32ncurses5-dev lib32z1 lib32stdc++6 \
            build-essential zlib1g-dev libffi-dev libssl-dev

      - name: Install Python 2.7 (required by MTK DCT DrvGen.py)
        run: |
          wget -q https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
          tar xzf Python-2.7.18.tgz
          cd Python-2.7.18
          ./configure --prefix=/usr/local >/dev/null
          make -j$(nproc --all) >/dev/null
          sudo make install >/dev/null
          sudo ln -sf /usr/local/bin/python2.7 /usr/bin/python2
          sudo ln -sf /usr/local/bin/python2.7 /usr/bin/python
          python2 --version
          python --version

      - name: Download toolchains
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchains/clang-llvm
          mkdir -p $GITHUB_WORKSPACE/toolchains/gcc64-aosp
          mkdir -p $GITHUB_WORKSPACE/toolchains/gcc32-aosp
          cd $GITHUB_WORKSPACE/toolchains

          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-qpr3-release/clang-r383902b1.tar.gz
          tar -C clang-llvm/ -xzf clang-r383902b1.tar.gz

          wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-11.0.0_r35.tar.gz
          tar -C gcc64-aosp/ -xzf android-11.0.0_r35.tar.gz

          wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-11.0.0_r34.tar.gz
          tar -C gcc32-aosp/ -xzf android-11.0.0_r34.tar.gz

          echo "TOOLCHAINS=$GITHUB_WORKSPACE/toolchains" >> $GITHUB_ENV
          ls $GITHUB_WORKSPACE/toolchains/clang-llvm/bin | head -5

      - name: Integrate KernelSU-Next (legacy)
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/legacy/kernel/setup.sh" | bash -s legacy
          ls drivers/kernelsu/

      - name: Patch KernelSU-Next legacy for 4.14 kprobe mode
        run: |
          python3 - <<'EOF'
          import re
          p = "drivers/kernelsu/feature/selinux_hide.c"
          s = open(p).read()
          old = "\twhile (READ_ONCE(ksu_input_hook))\n\t\tmsleep(5000);\n"
          new = "#if !defined(CONFIG_KSU_KPROBES_HOOK)\n\twhile (READ_ONCE(ksu_input_hook))\n\t\tmsleep(5000);\n#endif\n"
          assert old in s, "selinux_hide.c pattern not found"
          open(p, "w").write(s.replace(old, new))
          print("patched selinux_hide.c")
          EOF
          grep -n "KSU_KPROBES_HOOK" drivers/kernelsu/feature/selinux_hide.c

      - name: Enable KernelSU-Next in defconfig
        run: |
          echo "# KernelSU-Next" >> arch/arm64/configs/${DEVICE}_defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/${DEVICE}_defconfig
          grep -q "^CONFIG_KPROBES=y" arch/arm64/configs/${DEVICE}_defconfig || echo "CONFIG_KPROBES=y" >> arch/arm64/configs/${DEVICE}_defconfig
          grep -q "^CONFIG_HAVE_KPROBES=y" arch/arm64/configs/${DEVICE}_defconfig || echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/${DEVICE}_defconfig
          grep -q "^CONFIG_KRETPROBES=y" arch/arm64/configs/${DEVICE}_defconfig || echo "CONFIG_KRETPROBES=y" >> arch/arm64/configs/${DEVICE}_defconfig
          grep -q "^CONFIG_KPROBE_EVENTS=y" arch/arm64/configs/${DEVICE}_defconfig || echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/${DEVICE}_defconfig
          grep -q "^CONFIG_MODULES=y" arch/arm64/configs/${DEVICE}_defconfig || echo "CONFIG_MODULES=y" >> arch/arm64/configs/${DEVICE}_defconfig
          grep -q "^CONFIG_KSU_KPROBES_HOOK=y" arch/arm64/configs/${DEVICE}_defconfig || echo "CONFIG_KSU_KPROBES_HOOK=y" >> arch/arm64/configs/${DEVICE}_defconfig

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$TOOLCHAINS/clang-llvm/bin:$TOOLCHAINS/gcc64-aosp/bin:$TOOLCHAINS/gcc32-aosp/bin:$PATH"
          export DTC_EXT=dtc

          make O=out ARCH=arm64 ${DEVICE}_defconfig
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LD=ld.lld \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy

      - name: Package AnyKernel3
        run: |
          IMAGE=out/arch/arm64/boot/Image.gz-dtb
          if [ -f "$IMAGE" ]; then
            cd AnyKernel3-master
            rm -f *.zip *-dtb
            cp ../$IMAGE Image.gz-dtb
            DATE=$(date "+%Y%m%d-%H%M")
            ZIPNAME="Shas-Dream-KSU-${DEVICE}-A11"
            zip -r9 "$ZIPNAME-${DATE}.zip" .
            echo "ZIP_FILE=AnyKernel3-master/$ZIPNAME-${DATE}.zip" >> $GITHUB_ENV
          else
            echo "Kernel image not found!"
            exit 1
          fi

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: Shas-Dream-KSU-${{ env.DEVICE }}-A11
          path: AnyKernel3-master/*.zip
