name: Build Kernel with KernelSU

on:
  workflow_dispatch:
    inputs:
      device:
        description: Device to build
        type: choice
        options:
          - lancelot
          - merlin
        default: lancelot

jobs:
  build:
    name: Build kernel for ${{ github.event.inputs.device }}
    runs-on: ubuntu-22.04
    env:
      DEVICE: ${{ github.event.inputs.device || 'lancelot' }}

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: devmaxx-noc

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison ca-certificates cpio curl file flex git make \
            libssl-dev libncurses-dev xz-utils zlib1g-dev \
            device-tree-compiler perl python3 zip unzip \
            libc6-dev-i386 lib32ncurses5-dev lib32z1 lib32stdc++6 \
            build-essential zlib1g-dev libffi-dev libssl-dev

      - name: Install Python 2.7 (required by MTK DCT DrvGen.py)
        run: |
          wget -q https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
          tar xzf Python-2.7.18.tgz
          cd Python-2.7.18
          ./configure --prefix=/usr/local >/dev/null
          make -j$(nproc --all) >/dev/null
          sudo make install >/dev/null
          sudo ln -sf /usr/local/bin/python2.7 /usr/bin/python2
          sudo ln -sf /usr/local/bin/python2.7 /usr/bin/python

      - name: Download toolchains
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchains/clang-llvm
          mkdir -p $GITHUB_WORKSPACE/toolchains/gcc64-aosp
          mkdir -p $GITHUB_WORKSPACE/toolchains/gcc32-aosp
          cd $GITHUB_WORKSPACE/toolchains

          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android13-release/clang-r450784d.tar.gz
          tar -C clang-llvm/ -xzf clang-r450784d.tar.gz

          wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-11.0.0_r35.tar.gz
          tar -C gcc64-aosp/ -xzf android-11.0.0_r35.tar.gz

          wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-11.0.0_r34.tar.gz
          tar -C gcc32-aosp/ -xzf android-11.0.0_r34.tar.gz

          echo "TOOLCHAINS=$GITHUB_WORKSPACE/toolchains" >> $GITHUB_ENV
          $GITHUB_WORKSPACE/toolchains/clang-llvm/bin/clang --version | head -3

      - name: Integrate KernelSU v0.9.5
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh" | bash -s v0.9.5
          ls drivers/kernelsu/

      - name: Enable KernelSU in defconfig (manual hook mode, NO kprobes)
        run: |
          # KPROBES is BROKEN on this MTK 4.14 kernel (bootloop: do_undefinstr /
          # IABT in kprobe path during kernel_init). Official v0.9.5 non-GKI
          # integration: CONFIG_KSU=y + manual source hooks, kprobes OFF.
          # With !KPROBES, KSU_MANUAL_HOOK defaults to y automatically
          # (drivers/kernelsu/Kconfig: "default y if !KPROBES").
          echo "# KernelSU (manual hook mode)" >> arch/arm64/configs/${DEVICE}_defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/${DEVICE}_defconfig
          echo "# CONFIG_KPROBES is not set" >> arch/arm64/configs/${DEVICE}_defconfig
          grep -q "^CONFIG_KALLSYMS=y" arch/arm64/configs/${DEVICE}_defconfig || echo "CONFIG_KALLSYMS=y" >> arch/arm64/configs/${DEVICE}_defconfig
          tail -6 arch/arm64/configs/${DEVICE}_defconfig

      - name: Apply KernelSU manual hooks to kernel source
        run: |
          python3 << 'EOF'
          import re, sys

          def patch(path, fn_pat, extern_block, hook_block, label):
              with open(path, encoding='utf-8') as f:
                  src = f.read()
              m = re.search(fn_pat, src, re.S)
              if not m:
                  print(f"[FAIL] {label}: marker not found in {path}")
                  sys.exit(1)
              tail_before = src[max(0, m.start()-300):m.start()]
              if '#ifdef CONFIG_KSU' in tail_before:
                  print(f"[SKIP] {label}: already patched")
                  return
              src = src[:m.end()] + hook_block + src[m.end():]
              src = src[:m.start()] + extern_block + src[m.start():]
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(src)
              print(f"[OK] {label}")

          # 1) fs/exec.c - do_execveat_common -> ksu_handle_execveat (+sucompat)
          patch("fs/exec.c",
                r"static int do_execveat_common\(int fd, struct filename \*filename,\n\s*struct user_arg_ptr argv,\n\s*struct user_arg_ptr envp,\n\s*int flags\)\n\{\n",
                '''#ifdef CONFIG_KSU
          extern bool ksu_execveat_hook __read_mostly;
          extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv,
                          void *envp, int *flags);
          extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr,
                           void *argv, void *envp, int *flags);
          #endif
          ''',
                '''#ifdef CONFIG_KSU
          \tif (unlikely(ksu_execveat_hook))
          \t\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
          \telse
          \t\tksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);
          #endif
          ''',
                "exec.c/do_execveat_common")

          # 2) fs/open.c - faccessat syscall (no do_faccessat in this 4.14 source)
          patch("fs/open.c",
                r"SYSCALL_DEFINE3\(faccessat, int, dfd, const char __user \*, filename, int, mode\)\n\{\n",
                '''#ifdef CONFIG_KSU
          extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,
                          int *mode, int *flags);
          #endif
          ''',
                '''#ifdef CONFIG_KSU
          \tksu_handle_faccessat(&dfd, &filename, &mode, NULL);
          #endif
          ''',
                "open.c/faccessat")

          # 3) fs/read_write.c - vfs_read (injects ksud.rc into atrace.rc at boot)
          patch("fs/read_write.c",
                r"ssize_t vfs_read\(struct file \*file, char __user \*buf, size_t count, loff_t \*pos\)\n\{\n",
                '''#ifdef CONFIG_KSU
          extern bool ksu_vfs_read_hook __read_mostly;
          extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr,
                          size_t *count_ptr, loff_t **pos);
          #endif
          ''',
                '''#ifdef CONFIG_KSU
          \tif (unlikely(ksu_vfs_read_hook))
          \t\tksu_handle_vfs_read(&file, &buf, &count, &pos);
          #endif
          ''',
                "read_write.c/vfs_read")

          # 4) fs/stat.c - vfs_statx (newfstatat -> su path hiding)
          patch("fs/stat.c",
                r"int vfs_statx\(int dfd, const char __user \*filename, int flags,\n\s*struct kstat \*stat, u32 request_mask\)\n\{\n",
                '''#ifdef CONFIG_KSU
          extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);
          #endif
          ''',
                '''#ifdef CONFIG_KSU
          \tksu_handle_stat(&dfd, &filename, &flags);
          #endif
          ''',
                "stat.c/vfs_statx")

          # 5) fs/devpts/inode.c - devpts_get_priv (fixes "Failed to execute pm")
          patch("fs/devpts/inode.c",
                r"void \*devpts_get_priv\(struct dentry \*dentry\)\n\{\n",
                '''#ifdef CONFIG_KSU
          extern int ksu_handle_devpts(struct inode*);
          #endif
          ''',
                '''#ifdef CONFIG_KSU
          \tksu_handle_devpts(dentry->d_inode);
          #endif
          ''',
                "devpts/inode.c")

          # 6) drivers/input/input.c - input_handle_event (KernelSU safe mode)
          patch("drivers/input/input.c",
                r"static void input_handle_event\(struct input_dev \*dev,\n\s*unsigned int type, unsigned int code, int value\)\n\{\n",
                '''#ifdef CONFIG_KSU
          extern bool ksu_input_hook __read_mostly;
          extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);
          #endif
          ''',
                '''#ifdef CONFIG_KSU
          \tif (unlikely(ksu_input_hook))
          \t\tksu_handle_input_handle_event(&type, &code, &value);
          #endif
          ''',
                "input.c/input_handle_event")

          print("All manual hooks applied.")
          EOF

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$TOOLCHAINS/clang-llvm/bin:$TOOLCHAINS/gcc64-aosp/bin:$TOOLCHAINS/gcc32-aosp/bin:$PATH"
          export DTC_EXT=dtc

          make O=out ARCH=arm64 ${DEVICE}_defconfig
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LD=ld.lld \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy

      - name: Assert AnyKernel3 installer scripts are LF-only and BOM-free
        run: |
          AK=AnyKernel3-master
          fail=0
          for f in "$AK/anykernel.sh" "$AK/tools/ak3-core.sh" "$AK/META-INF/com/google/android/update-binary" "$AK/META-INF/com/google/android/updater-script"; do
            if [ ! -f "$f" ]; then
              echo "FATAL: missing installer script $f"
              fail=1
              continue
            fi
            if [ "$(head -c 3 "$f" | od -An -tx1 | tr -d ' \n')" = "efbbbf" ]; then
              echo "FATAL: $f starts with a UTF-8 BOM -- busybox ash treats line 1 as a command instead of a comment"
              fail=1
            fi
            n=$(tr -cd '\r' < "$f" | wc -c)
            if [ "$n" -ne 0 ]; then
              echo "FATAL: $f contains $n CR byte(s). busybox ash runs a bare CR as a command, fails with"
              echo "       'line N: : not found' and exits 127; update-binary turns that into a silent"
              echo "       'Updater process ended with ERROR: 1' with no reason shown on screen."
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "These files are edited from Windows -- see SUSFS-HANDOFF.md section 7 on encoding hazards."
            exit 1
          fi
          echo "AnyKernel3 installer scripts: LF-only, no BOM -- OK"

      - name: Package AnyKernel3
        run: |
          IMAGE=out/arch/arm64/boot/Image.gz-dtb
          if [ -f "$IMAGE" ]; then
            cd AnyKernel3-master
            rm -f *.zip *-dtb
            cp ../$IMAGE Image.gz-dtb
            DATE=$(date "+%Y%m%d-%H%M")
            ZIPNAME="DevMaxx-JK-KSU-${DEVICE}-A11"
            zip -r9 "$ZIPNAME-${DATE}.zip" .
            echo "ZIP_FILE=AnyKernel3-master/$ZIPNAME-${DATE}.zip" >> $GITHUB_ENV
          else
            echo "Kernel image not found!"
            exit 1
          fi

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: DevMaxx-JK-KSU-${{ env.DEVICE }}-A11
          path: AnyKernel3-master/*.zip

