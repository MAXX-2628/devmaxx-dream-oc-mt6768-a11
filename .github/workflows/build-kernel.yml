name: Build Kernel with KernelSU

on:
  workflow_dispatch:
    inputs:
      device:
        description: Device to build
        type: choice
        options:
          - lancelot
          - merlin
        default: lancelot

jobs:
  build:
    name: Build kernel for ${{ github.event.inputs.device }}
    runs-on: ubuntu-22.04
    env:
      DEVICE: ${{ github.event.inputs.device || 'lancelot' }}

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: shas-susfs-next

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison ca-certificates cpio curl file flex git make \
            libssl-dev libncurses-dev xz-utils zlib1g-dev \
            device-tree-compiler perl python3 zip unzip \
            libc6-dev-i386 lib32ncurses5-dev lib32z1 lib32stdc++6 \
            build-essential zlib1g-dev libffi-dev libssl-dev

      - name: Install Python 2.7 (required by MTK DCT DrvGen.py)
        run: |
          wget -q https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
          tar xzf Python-2.7.18.tgz
          cd Python-2.7.18
          ./configure --prefix=/usr/local >/dev/null
          make -j$(nproc --all) >/dev/null
          sudo make install >/dev/null
          sudo ln -sf /usr/local/bin/python2.7 /usr/bin/python2
          sudo ln -sf /usr/local/bin/python2.7 /usr/bin/python

      - name: Download toolchains
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchains/clang-llvm
          mkdir -p $GITHUB_WORKSPACE/toolchains/gcc64-aosp
          mkdir -p $GITHUB_WORKSPACE/toolchains/gcc32-aosp
          cd $GITHUB_WORKSPACE/toolchains

          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android13-release/clang-r450784d.tar.gz
          tar -C clang-llvm/ -xzf clang-r450784d.tar.gz

          wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-11.0.0_r35.tar.gz
          tar -C gcc64-aosp/ -xzf android-11.0.0_r35.tar.gz

          wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-11.0.0_r34.tar.gz
          tar -C gcc32-aosp/ -xzf android-11.0.0_r34.tar.gz

          echo "TOOLCHAINS=$GITHUB_WORKSPACE/toolchains" >> $GITHUB_ENV
          $GITHUB_WORKSPACE/toolchains/clang-llvm/bin/clang --version | head -3

      - name: Integrate KernelSU-Next (pinned v3.1.0-legacy-susfs)
        run: |
          set -e
          # Pinned explicitly (both the URL ref and the `-s` arg name the
          # tag) so this never silently drifts to whatever tag is newest --
          # currently v3.3.0, the ioctl-dispatch/modularized architecture
          # this migration exists to avoid. setup.sh's no-arg behavior
          # defaults to "latest tag", so the explicit arg is mandatory here.
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/v3.1.0-legacy-susfs/kernel/setup.sh" | bash -s v3.1.0-legacy-susfs
          ls -la drivers/kernelsu/

          # Verify the symlink actually resolved to the pinned tag.
          # setup.sh clones into $GITHUB_WORKSPACE/KernelSU-Next and
          # symlinks drivers/kernelsu -> KernelSU-Next/kernel.
          cd "$GITHUB_WORKSPACE/KernelSU-Next"
          ACTUAL_TAG="$(git describe --tags)"
          echo "KernelSU-Next checked out at: $ACTUAL_TAG"
          if [ "$ACTUAL_TAG" != "v3.1.0-legacy-susfs" ]; then
            echo "ERROR: expected v3.1.0-legacy-susfs, got $ACTUAL_TAG"
            exit 1
          fi
          cd "$GITHUB_WORKSPACE"

      - name: Add susfs kernel-tree sources (kernel-4.14)
        run: |
          set -e

          # susfs is already built into the pinned KernelSU-Next tag
          # (v3.1.0-legacy-susfs) -- unlike the old v0.9.5 workflow, there is
          # no separate "apply the KSU-side susfs enable patch" step here.
          # Checking out that pinned tag *is* the KSU-side integration.

          # susfs kernel-side sources (unmodified upstream copies)
          cp susfs/fs/susfs.c fs/susfs.c
          cp susfs/fs/sus_su.c fs/sus_su.c
          cp susfs/include/linux/susfs.h include/linux/susfs.h
          cp susfs/include/linux/susfs_def.h include/linux/susfs_def.h
          cp susfs/include/linux/sus_su.h include/linux/sus_su.h

          # Apply our MTK-4.14-adapted 50_add patch at the kernel root.
          # The stock patch does NOT apply cleanly on this MTK tree (3
          # rejected hunks: fs/notify/fdinfo.c, fs/proc/task_mmu.c,
          # kernel/sys.c all have MTK-added code the upstream susfs patch
          # doesn't expect) -- this adapted copy has those hand-fixed.
          patch -p1 --forward < susfs/patches/50_add_susfs_in_kernel-4.14-mtk.patch
          if find . -name '*.rej' | grep -q .; then
            echo "50_add patch left .rej files:"
            find . -name '*.rej' -exec cat {} \;
            exit 1
          fi

      - name: Enable KernelSU-Next + susfs in defconfig (manual hook mode)
        run: |
          # v3.1.0-legacy-susfs uses CONFIG_KSU_MANUAL_HOOK ("default y if
          # !KPROBES" in kernel/Kconfig) -- NOT CONFIG_KSU_WITH_KPROBES=n,
          # which was based on inaccurate web docs for a different KSU-Next
          # architecture (confirmed against Task 3's real Kconfig read and
          # Task 5's hook-set report). KPROBES is BROKEN on this MTK 4.14
          # kernel (bootloop: do_undefinstr / IABT in kprobe path during
          # kernel_init), so it's set explicitly rather than relying on the
          # Kconfig default.
          echo "# KernelSU-Next (manual hook mode)" >> arch/arm64/configs/${DEVICE}_defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/${DEVICE}_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/${DEVICE}_defconfig
          echo "# CONFIG_KPROBES is not set" >> arch/arm64/configs/${DEVICE}_defconfig
          grep -q "^CONFIG_KALLSYMS=y" arch/arm64/configs/${DEVICE}_defconfig || echo "CONFIG_KALLSYMS=y" >> arch/arm64/configs/${DEVICE}_defconfig

          # susfs -- only the CONFIG_KSU_SUSFS_* flags that actually exist in
          # this tag's kernel/Kconfig (verified in
          # susfs/ksu-next-susfs-verification.md, Step 1). These 5 flags
          # don't exist in this KernelSU-Next tag's Kconfig, so writing them
          # is a no-op -- but that's not the same as "nothing lost":
          # SUS_OVERLAYFS, AUTO_ADD_SUS_BIND_MOUNT,
          # AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT, and AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
          # together guard ~19 hunks across
          # 50_add_susfs_in_kernel-4.14-mtk.patch and susfs/fs/susfs.c --
          # overlayfs-based hiding and automatic mount/bind-mount/try-umount
          # registration are genuinely absent versus the old shas-susfs
          # build, not just unavailable-but-harmless config lines
          # (_HAS_MAGIC_MOUNT is the 5th missing flag, also dropped as a
          # no-op). This tag also adds one flag the old defconfig never had
          # (_SUS_MAP); left disabled below to preserve the old config's
          # on/off intent for everything else without speculatively
          # enabling new behavior.
          #
          # SUS_PATH is disabled (Task 9, run 31582626614): our vendored
          # susfs4ksu kernel-4.14 source (frozen 2025-02-23) predates this
          # KSU-Next tag's kernel/supercalls.c, which under
          # #ifdef CONFIG_KSU_SUSFS_SUS_PATH also calls
          # susfs_add_sus_path_loop() / susfs_set_i_state_on_external_dir()
          # -- newer _loop/_root_path variants our vendored fs/susfs.c never
          # implemented. The design doc (SUSFS-HANDOFF.md Sec.4) already
          # flagged this flag "NOT recommended, but harmless"; disabling it
          # avoids porting 3 more functions/cmd-IDs for a feature that was
          # optional to begin with.
          #
          # CORRECTION (Task 9, round 5 review): this IS a real feature
          # regression versus the old shas-susfs build, not a no-op --
          # shas-susfs had CONFIG_KSU_SUSFS_SUS_PATH=y. Disabling the flag
          # removes fs/susfs.c's entire sus_path block (susfs_add_sus_path
          # included, lines ~35-138 -- confirmed by reading the actual
          # #ifdef CONFIG_KSU_SUSFS_SUS_PATH .. #endif span), so no sus_path
          # hiding of any kind survives, basic or otherwise. It is NOT
          # "still compiled in via SUS_MOUNT/etc" as an earlier version of
          # this comment claimed -- SUS_MOUNT hides mount entries, a
          # different mechanism that does not substitute for path hiding.
          # The decision to disable it stands (see reasoning above), but
          # this comment previously overstated what's preserved. See
          # susfs/ksu-next-susfs-verification.md for the full flag-by-flag
          # comparison against this KSU-Next tag's actual Kconfig.
          #
          # WARNING: ENABLE_LOG, OPEN_REDIRECT, and SUS_MAP are not just
          # "off" -- flipping any of these to =y will BREAK THE BUILD
          # against this vendored susfs source (function name/signature
          # mismatches with what KernelSU-Next's supercalls.c actually
          # calls). Do not enable without first porting the corresponding
          # functions properly (same discipline as Task 9's other fixes).
          cat >> arch/arm64/configs/${DEVICE}_defconfig << 'EOF'
          # susfs
          CONFIG_KSU_SUSFS=y
          # CONFIG_KSU_SUSFS_SUS_PATH is not set
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          # CONFIG_KSU_SUSFS_ENABLE_LOG is not set
          # CONFIG_KSU_SUSFS_OPEN_REDIRECT is not set
          # CONFIG_KSU_SUSFS_SUS_MAP is not set
          EOF

          tail -20 arch/arm64/configs/${DEVICE}_defconfig

      - name: Apply KernelSU-Next manual hooks to kernel source
        run: |
          # KernelSU-Next's manual-hook surface (v3.1.0-legacy-susfs) is not
          # the same shape as v0.9.5's -- lsm_hooks.c registers the
          # inode_permission/inode_rename/task_fix_setuid hooks automatically
          # in manual-hook mode, and kernel/reboot.c needs a new
          # ksu_handle_sys_reboot() hook that v0.9.5 never had (build-mandatory
          # per KernelSU-Next's own Kbuild grep-check). See Task 5's report
          # and susfs/hooks/apply_ksu_next_hooks.py for the full 6-hook set
          # and rationale (idempotent, safe to re-run).
          python3 susfs/hooks/apply_ksu_next_hooks.py

      - name: Generate defconfig
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$TOOLCHAINS/clang-llvm/bin:$TOOLCHAINS/gcc64-aosp/bin:$TOOLCHAINS/gcc32-aosp/bin:$PATH"
          export DTC_EXT=dtc

          make O=out ARCH=arm64 ${DEVICE}_defconfig

      - name: Assert critical Kconfig flags survived defconfig resolution
        run: |
          set -e
          # Dependency resolution (e.g. CONFIG_KSU_SUSFS's new
          # "depends on THREAD_INFO_IN_TASK" in this KernelSU-Next tag,
          # confirmed satisfied on this kernel's arch/arm64/Kconfig -- see
          # susfs/ksu-next-susfs-verification.md) can silently drop a flag
          # we asked for in the ${DEVICE}_defconfig append step if some
          # dependency isn't met. This is a standing CI guard against that
          # happening unnoticed, not just a one-time manual check.
          for flag in \
            CONFIG_KSU=y \
            CONFIG_KSU_MANUAL_HOOK=y \
            CONFIG_KSU_SUSFS=y \
            CONFIG_KSU_SUSFS_SUS_MOUNT=y \
            CONFIG_KSU_SUSFS_SUS_KSTAT=y \
            CONFIG_KSU_SUSFS_TRY_UMOUNT=y \
            CONFIG_KSU_SUSFS_SPOOF_UNAME=y \
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y \
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y \
          ; do
            grep -qx "$flag" out/.config || { echo "FATAL: $flag missing from generated .config"; exit 1; }
          done
          grep -q "^# CONFIG_KPROBES is not set" out/.config || { echo "FATAL: CONFIG_KPROBES is set (expected unset -- KPROBES is broken on this MTK 4.14 kernel)"; exit 1; }
          echo "All critical Kconfig flags verified present in out/.config"

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$TOOLCHAINS/clang-llvm/bin:$TOOLCHAINS/gcc64-aosp/bin:$TOOLCHAINS/gcc32-aosp/bin:$PATH"
          export DTC_EXT=dtc

          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LD=ld.lld \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            KSU_EXPECTED_SIZE=0x0374 \
            KSU_EXPECTED_HASH=96a902c4e19f34fa1bb857390a957980c921a8253a0a637addfabc95b0552d21

      - name: Package AnyKernel3
        run: |
          IMAGE=out/arch/arm64/boot/Image.gz-dtb
          if [ -f "$IMAGE" ]; then
            cd AnyKernel3-master
            rm -f *.zip *-dtb
            cp ../$IMAGE Image.gz-dtb
            DATE=$(date "+%Y%m%d-%H%M")
            ZIPNAME="DevMaxx-JK-KSU-${DEVICE}-A11"
            zip -r9 "$ZIPNAME-${DATE}.zip" .
            echo "ZIP_FILE=AnyKernel3-master/$ZIPNAME-${DATE}.zip" >> $GITHUB_ENV
          else
            echo "Kernel image not found!"
            exit 1
          fi

      - name: Package susfs userspace module
        run: |
          cd susfs/ksu_module_susfs
          zip -r9 "$GITHUB_WORKSPACE/susfs-module-${DEVICE}.zip" . -x '*.git*'

      - name: Upload flashable kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: DevMaxx-JK-KSU-${{ env.DEVICE }}-A11
          path: AnyKernel3-master/*.zip

      - name: Upload susfs module zip
        uses: actions/upload-artifact@v4
        with:
          name: susfs-module-${{ env.DEVICE }}
          path: susfs-module-${{ env.DEVICE }}.zip
